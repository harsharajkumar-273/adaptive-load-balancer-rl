# config.yaml - Configuration-Driven Architecture Settings
cluster:
  num_instances: 5          # initial / minimum fleet size
  max_instances: 10         # autoscaler ceiling
  port: 8000
  host: "0.0.0.0"
  checkpoint_path: "model_checkpoint.npz"
  routing_strategy: "lin_ts"  # Options: lin_ts, least_conn, p2c, round_robin, weighted_round_robin

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0

sla:
  latency_ms: 200.0
  staleness_threshold_sec: 1.0

agent:
  control_plane_interval_sec: 0.15
  exploration_param: 0.3
  temperature: 0.2
  reward_weights:
    latency: 1.0
    error: 5.0
    sla: 10.0

backends:
  - id: 1
    name: "Instance-1 (High-Compute)"
    base_latency_ms: 10.0
    capacity: 150.0
    cpu_multiplier: 0.5
    error_threshold_cpu: 95.0
    jitter_min_ms: 0.0
    jitter_max_ms: 2.0
    port: 8001
    url: "http://127.0.0.1:8001"

  - id: 2
    name: "Instance-2 (Standard-Med)"
    base_latency_ms: 25.0
    capacity: 80.0
    cpu_multiplier: 0.8
    error_threshold_cpu: 95.0
    jitter_min_ms: 0.0
    jitter_max_ms: 4.0
    port: 8002
    url: "http://127.0.0.1:8002"

  - id: 3
    name: "Instance-3 (Standard-Slow)"
    base_latency_ms: 40.0
    capacity: 60.0
    cpu_multiplier: 1.1
    error_threshold_cpu: 95.0
    jitter_min_ms: 0.0
    jitter_max_ms: 6.0
    port: 8003
    url: "http://127.0.0.1:8003"

  - id: 4
    name: "Instance-4 (Unstable-Jittery)"
    base_latency_ms: 20.0
    capacity: 50.0
    cpu_multiplier: 1.2
    error_threshold_cpu: 70.0
    jitter_min_ms: 2.0
    jitter_max_ms: 25.0
    port: 8004
    url: "http://127.0.0.1:8004"

  - id: 5
    name: "Instance-5 (Slow-Legacy)"
    base_latency_ms: 80.0
    capacity: 20.0
    cpu_multiplier: 2.5
    error_threshold_cpu: 90.0
    jitter_min_ms: 5.0
    jitter_max_ms: 15.0
    port: 8005
    url: "http://127.0.0.1:8005"
